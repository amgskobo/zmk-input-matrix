name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Recheck moving upstream and DYA main branches even without local changes.
    - cron: '42 2 * * 6'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  ZMK_TEST_IMAGE: zmkfirmware/zmk-build-arm@sha256:edb1c953438c6f720ddb79c3762f3972013b7fbbaf4fff3592fc869983e7afc5
  ZMK_TEST_MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'quick' }}

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Exercise all driver, proxy and settings scenarios
        run: bash tests/run-docker.sh

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [upstream, dya]
    steps:
      - uses: actions/checkout@v5
      - name: Require an explicit published final-filter dependency
        env:
          SUPPRESS_REPOSITORY: ${{ vars.ZMK_SUPPRESS_REPOSITORY }}
          SUPPRESS_REVISION: ${{ vars.ZMK_SUPPRESS_REVISION }}
        run: |
          test -n "$SUPPRESS_REPOSITORY" || { echo 'Set ZMK_SUPPRESS_REPOSITORY after publishing the separate module'; exit 2; }
          [[ "$SUPPRESS_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Set ZMK_SUPPRESS_REVISION to the reviewed full commit'; exit 2; }
      - name: Check out the reviewed final filter
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.ZMK_SUPPRESS_REPOSITORY }}
          ref: ${{ vars.ZMK_SUPPRESS_REVISION }}
          path: .test-dependencies/suppress
          persist-credentials: false
      - name: Check out the pinned IQS click producer
        uses: actions/checkout@v5
        with:
          repository: amgskobo/zmk-iqs7211e-driver
          ref: 6114ec0b6ac859380125afd60a9c042a0cfa2406
          path: .test-dependencies/iqs
          persist-credentials: false
      - name: Build firmware and exercise Matrix with the actual IQS producer
        env:
          ZMK_TEST_SUPPRESS_ROOT: ${{ github.workspace }}/.test-dependencies/suppress
          ZMK_TEST_IQS_ROOT: ${{ github.workspace }}/.test-dependencies/iqs
          ZMK_TEST_REQUIRE_IQS: '1'
          ZMK_TEST_OUTPUT: ${{ runner.temp }}/matrix-results/${{ matrix.variant }}
        run: |
          mkdir -p "$RUNNER_TEMP/matrix-results"
          set -o pipefail
          bash ./tests/run-integration-docker.sh ${{ matrix.variant }} 2>&1 | tee "$RUNNER_TEMP/matrix-results/${{ matrix.variant }}.log"
      - name: Preserve ordered results and source identities
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matrix-${{ matrix.variant }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/matrix-results/${{ matrix.variant }}.log
            ${{ runner.temp }}/matrix-results/${{ matrix.variant }}/kernel/CMakeCache.txt
            ${{ runner.temp }}/matrix-results/${{ matrix.variant }}/kernel/zephyr/.config
            ${{ runner.temp }}/matrix-results/${{ matrix.variant }}/kernel/zephyr/zephyr.dts
            ${{ runner.temp }}/matrix-results/${{ matrix.variant }}/kernel/zephyr/zmk.exe
            ${{ runner.temp }}/matrix-results/${{ matrix.variant }}/kernel*.log
            ${{ runner.temp }}/matrix-results/${{ matrix.variant }}/ownership
            ${{ runner.temp }}/matrix-results/${{ matrix.variant }}/build/zephyr/.config
            ${{ runner.temp }}/matrix-results/${{ matrix.variant }}/build/zephyr/zephyr.dts
            ${{ runner.temp }}/matrix-results/${{ matrix.variant }}/build/zephyr/zmk.uf2
