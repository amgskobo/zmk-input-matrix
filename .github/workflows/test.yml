name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Recheck moving upstream and DYA main branches even without local changes.
    - cron: '42 2 * * 6'

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Exercise driver coordinate and gesture functions
        run: python3 tests/geometry/run.py

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [upstream, dya]
    steps:
      - uses: actions/checkout@v5
      - name: Build the ${{ matrix.variant }} ZMK firmware fixture
        run: bash ./tests/run-integration-docker.sh ${{ matrix.variant }}
