description: ZMK Input Processor - Gesture Grid & Flick Recognition

compatible: "zmk,input-processor-matrix"

include: ip_zero_param.yaml

properties:
  rows:
    type: int
    required: true
    description: Number of rows in the gesture grid. Must be 1 to 51.
  columns:
    type: int
    required: true
    description: Number of columns in the gesture grid. Must be 1 to 255.
  x:
    type: int
    required: true
    description: Maximum X coordinate resolution (range is 0 to x). Must be 1 to 65534.
  y:
    type: int
    required: true
    description: Maximum Y coordinate resolution (range is 0 to y). Must be 1 to 65534.
  flick-threshold:
    type: int
    required: true
    description: |
      Minimum displacement in pixels to register a flick gesture. Must be 1 to 65535.
      A flick is latched when X or Y displacement first reaches this threshold.
      After that, the long-press timer is canceled and release reports the latched flick.
  suppress-abs:
    type: boolean
    description: |
      If true, consume all INPUT_EV_ABS events seen by this processor, not only
      INPUT_ABS_X and INPUT_ABS_Y. This prevents ABS pointer events from reaching
      later processors or the mouse HID.
  suppress-touch:
    type: boolean
    description: |
      If true, consume only INPUT_BTN_TOUCH after this processor updates its
      internal touch state. Other INPUT_EV_KEY events, such as button gestures
      emitted by the touchpad driver, continue downstream.
  suppress-key:
    type: boolean
    description: |
      If true, consume all INPUT_EV_KEY events seen by this processor, not only
      INPUT_BTN_TOUCH. This prevents KEY events from reaching later processors or
      behaviors.
  kscan:
    type: phandle
    required: true
    description: Phandle to the zmk,kscan-input-matrix proxy device to report gesture events.
  long-press-ms:
    type: int
    required: false
    default: 200
    description: |
      Milliseconds after BTN_TOUCH before the kscan cell is pressed (HOLD).
      Hold applies to the Tap block only. If a flick is latched before the timeout,
      the hold timer is canceled and the flick is reported as press+release on
      BTN_TOUCH release.
      The tap-hold cell stays pressed until BTN_TOUCH is released.
      Set to 0 to disable tap hold; taps and flicks are still reported as
      press+release pairs.
